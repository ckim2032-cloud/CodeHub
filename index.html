<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>CodeHub: Clayton's Code collection</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <style>
      body {
        background-color: white;
      }
      .title {
        font-family: Geist, Sans-serif;
        padding: 5px;
      }
      #mainTitle {
        
      }
      #top {
        background-color: white;
        border-bottom: 3px solid #e2e2e2;
        width: 100%;
        top: 0%;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      #message {
        font-famly: Geist, Sans-serif;
        color: #d5d5d5;
        padding: 2px;
      }
      #searchBar {
        font-family: JetBrains Mono, Sans-serif;
        background-color: #e2e2e2;
        border-radius: 20px;
        font-size: 18px;
        width: 300px;
        left: 70%;
        padding: 10px;
        border: 2px solid #d7d7d7;
      }
      .project {
        margin:15px 0;
      }
    </style>
  </head>
  <body>
    <div id="top">
      <h1 class="title" id="mainTitle"><strong>CodeHub</strong></h1>
      <h2 id="message">View my code projects on a whim.</h2>
      <input type="text" placeholder="Search for a project. . ." id="searchBar"></input>
    </div>
    <div class="project">
      PRISM Code Translator
    </div>
    <div class="project">
      Gravity Grounds
    </div>
    <div class="project">
      EP:05:16
    </div>
    <div class="project">
      Codehub
    </div>
    <div class="project">
      Abigail's Author Page
    </div>
  </body>
<script>
  // Search Bar functions
  const searchBar = document.getElementById("searchBar");
  const projects = document.querySelectorAll(".project");
  const noMatchMessage = document.createElement("h2");
  noMatchMessage.textContent = "No results matched your search.";
  document.body.appendChild(noMatchMessage);
  noMatchMessage.style.display = "none";
  searchBar.addEventListener("input", function(){
    const searchText = searchBar.value.toLowerCase();
    let foundMatch = false;
    projects.forEach(function(project){
      const projectName = project.textContent.toLowerCase();
      if(projectName.includes(searchText)){
          foundMatch = true;
          project.style.display = "block";
      }
      else{
          project.style.display = "none";
      }
    });
    if(foundMatch){
      noMatchMessage.style.display = "none";
    }
    else {
      noMatchMessage.style.display = "block";
    }
  });
</script>
</html>
