<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>CodeHub: Clayton's Code collection</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <style>
      body {
        background-color: white;
      }
      .title {
        font-family: Geist, Sans-serif;
        padding: 5px;
      }
      #mainTitle {
        margin-bottom: 30px;
      }
      #top {
        background-color: white;
        border-bottom: 3px solid #e2e2e2;
        width: 100%;
        top: 0%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }
      #message {
        font-family: Geist, Sans-serif;
        color: #d5d5d5;
        padding: 2px;
      }
      #searchBar {
        font-family: JetBrains Mono, Sans-serif;
        background-color: #e2e2e2;
        border-radius: 20px;
        height: 10px;
        font-size: 18px;
        width: 300px;
        left: 70%;
        padding: 10px;
        border: 2px solid #d7d7d7;
      }
      .project {
        margin:15px 0;
        height: 60px;
        width: 85%;
        border: 2px solid #d7d7d7;
        background-color: #f5f5f5;
        border-radius: 15px;
        padding: 15px;
        font-family: Geist, Sans-serif;
        left: 60px;
      }
      .project-title {
        font-family: Geist, Sans-serif;
        font-size: 20px;
        left: 100px;
        top: 20%;
      }
    </style>
  </head>
  <body>
    <div id="top">
      <h1 class="title" id="mainTitle"><strong>CodeHub</strong></h1>
      <h2 id="message">View my code projects on a whim.</h2>
      <input type="text" placeholder="Search for a project. . ." id="searchBar"></input>
    </div>
    <div class="project">
      <h3 class="project-title">PRISM Code Translator</h3>
    </div>
    <div class="project">
      <h3 class="project-title">Gravity Grounds</h3>
    </div>
    <div class="project">
      <h3 class="project-title">EP:05:16</h3>
    </div>
    <div class="project">
      <h3 class="project-title">Codehub</h3>
    </div>
    <div class="project">
      <h3 class="project-title">Abigail's Author Page</h3>
    </div>
  </body>
<script>
  // Search Bar functions
  const searchBar = document.getElementById("searchBar");
  const projects = document.querySelectorAll(".project");
  const noMatchMessage = document.createElement("h2");
  noMatchMessage.textContent = "No results matched your search.";
  document.body.appendChild(noMatchMessage);
  noMatchMessage.style.display = "none";
  searchBar.addEventListener("input", function(){
    const searchText = searchBar.value.toLowerCase();
    let foundMatch = false;
    projects.forEach(function(project){
      const projectName = project.textContent.toLowerCase();
      if(projectName.includes(searchText)){
          foundMatch = true;
          project.style.display = "block";
      }
      else{
          project.style.display = "none";
      }
    });
    if(foundMatch){
      noMatchMessage.style.display = "none";
    }
    else {
      noMatchMessage.style.display = "block";
    }
  });
</script>
</html>
